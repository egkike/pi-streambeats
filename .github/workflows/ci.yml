name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    # Decides whether the expensive jobs are worth running. The bias is deliberate:
    # when the base commit is unknown or unreachable, it reports a code change, so the
    # pipeline runs too much rather than too little. A gate that skips work it should
    # have done is how a green build stops meaning anything.
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [ "${base//0/}" = "" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit unknown ($base): assuming code changed."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" HEAD | grep -qE \
            '^(extensions|lib|scripts|tests)/|^(package\.json|pnpm-lock\.yaml|tsconfig\.json|biome\.json|\.gitattributes|\.npmrc)$|^\.github/workflows/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the platform jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Pinned instead of -latest: the environment only changes when a commit says so.
    # Each platform proves what only it can: Ubuntu carries the declared Node floor,
    # macOS proves the darwin code path. Windows joins with T12, once the fake mpv
    # in the tests can speak named pipes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            node: "22.19.0"
          - os: ubuntu-26.04
            node: "24"
          - os: macos-26
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  ipc:
    name: ipc probe (macOS, real mpv)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # The unit tests fake mpv; this job proves the real transport on darwin.
    # It is the macOS part of the support contract, which no hardware here can cover.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: brew install mpv
      - run: node scripts/ipc-probe.mjs mpv

  gate:
    name: gate
    # One stable context for the required-status-check rule: matrix names change when a
    # platform or a Node version is added, and a required check that stops existing
    # blocks every merge to main. `skipped` is accepted only because `changes` decided
    # there was nothing to verify; any other outcome fails.
    needs: [changes, check, ipc]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every job succeeded or was deliberately skipped
        shell: bash
        run: |
          set -eu
          echo "changes: ${{ needs.changes.result }} (code=${{ needs.changes.outputs.code }})"
          echo "check:   ${{ needs.check.result }}"
          echo "ipc:     ${{ needs.ipc.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "The scope job itself failed; nothing downstream can be trusted."
            exit 1
          fi

          for result in "${{ needs.check.result }}" "${{ needs.ipc.result }}"; do
            case "$result" in
              success) ;;
              skipped) echo "Skipped on purpose by the scope job." ;;
              *) echo "Unexpected result: $result"; exit 1 ;;
            esac
          done
