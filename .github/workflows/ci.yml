name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only pull-request runs are cancellable: the push run on main is the evidence for
# that exact commit and must never be cancelled in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      transport: ${{ steps.filter.outputs.transport }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'extensions/**'
              - 'lib/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'biome.json'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
            transport:
              - 'lib/player/**'
              - 'lib/settings.ts'
              - 'scripts/ipc-probe.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Runner pinned, never -latest: an image migration has to be a visible edit.
    # Ubuntu carries the declared Node floor; macOS executes the darwin code path.
    # Windows joins with T12, once the fake mpv can speak named pipes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            node: "22.19.0"
          - os: ubuntu-26.04
            node: "24"
          - os: macos-26
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  ipc:
    name: ipc probe (macOS, real mpv)
    needs: [changes]
    # Narrowed on purpose: the macOS runner pool is small and starves under load, so
    # this native job follows the `transport` filter while darwin LOGIC stays covered
    # on every code change by the platform-parameterised unit tests (S19).
    if: needs.changes.outputs.transport == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: brew install mpv
      - run: node scripts/ipc-probe.mjs mpv
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "node: $(node -v)"
          echo "mpv:  $(mpv --version | head -1 || echo missing)"
          echo "TMPDIR: ${TMPDIR:-unset}"
          ls -la "${TMPDIR:-/tmp}" | grep -i streambeats || echo "no probe socket left behind"

  gate:
    name: gate
    # One stable context for the required-status-check rule: matrix names change when a
    # platform or Node version is added, and a required check that stops existing blocks
    # every merge. The gate always runs, so the context never goes absent; `skipped` is
    # accepted only because a filter decided there was nothing to verify.
    needs: [changes, check, ipc]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was deliberately skipped
        shell: bash
        run: |
          set -eu
          echo "filters: code=${{ needs.changes.outputs.code }} transport=${{ needs.changes.outputs.transport }}"
          echo "changes: ${{ needs.changes.result }}"
          echo "check:   ${{ needs.check.result }}"
          echo "ipc:     ${{ needs.ipc.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "The scope job itself failed; nothing downstream can be trusted."
            exit 1
          fi

          for result in "${{ needs.check.result }}" "${{ needs.ipc.result }}"; do
            case "$result" in
              success) ;;
              skipped) echo "Skipped by a path filter, not by accident." ;;
              *) echo "Unexpected result: $result"; exit 1 ;;
            esac
          done
