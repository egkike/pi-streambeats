name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    # Pinned instead of ubuntu-latest: CI runs the same distro as the project's main
    # target. ubuntu-latest still resolves to 24.04, and the label migrates on its own
    # schedule, which would change the environment without a commit.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 22.19 is the declared floor in engines.node: the promise is only real if CI runs it.
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
