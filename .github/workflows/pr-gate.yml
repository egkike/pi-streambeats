# PR governance gate — issue-first workflow (owner-approved issues only).
#
# Enforcement of AGENTS.md "Git Governance": a pull request in the CODE lane must
#   1. close or resolve at least one issue of THIS repository via a body
#      keyword (`Closes #N`, `Fixes #N`, `Resolves #N` — case-insensitive),
#   2. that issue must carry the `status:approved` label (owner approval),
#   3. carry EXACTLY ONE `type:*` label for the PR-type summary.
#
# The DOCS/TRACKING lane travels without an issue when no code comes with it, so
# the `lane` job decides which lane the PR is in and `issue-gate` is skipped for
# tracking-only changes. Skipping is deliberate: a check that paints red on every
# documentation PR teaches reviewers to ignore red. A skipped check reports
# nothing was verified, which is the truth; a green one would claim it was.
#
# This check is a REVIEW SIGNAL, NOT A MERGE LOCK: the only required context on
# `main` is `gate` from ci.yml. Runners ship `gh` preinstalled; nothing here needs
# jq or a checkout of the code.

name: pr-gate

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

# One run per event ACTION, and nothing cancels. This job takes a few seconds, and a
# cancelled check-run stays attached to the head SHA and paints the PR red even when every
# run that survived passed: we saw three runs for one PR, one of them cancelled, and
# mergeStateStatus reported UNSTABLE while the gate itself was green. Keying the group by
# the action keeps `opened` and `labeled` (emitted about a second apart by a single
# `gh pr create --label`) from killing each other; not cancelling keeps repeats of the SAME
# event from leaving the same scar.
concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  lane:
    name: lane
    # Pinned, never ubuntu-latest: an image migration stays a visible workflow edit.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Which lane is this pull request in
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # The CODE lane of AGENTS.md. Everything else — docs/, design/,
          # odd/, README, AGENTS.md, .github/ — rides the tracking lane.
          filters: |
            code:
              - 'extensions/**'
              - 'lib/**'
              - 'tests/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'biome.json'

  issue-gate:
    name: issue-gate
    needs: lane
    if: needs.lane.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Validate issue linkage, approval, and type label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          fail() { echo "::error::$*" >&2; exit 1; }

          body="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q '.body // ""')"
          [ -n "$body" ] || fail "PR body is empty: link an approved issue with 'Closes #N'."

          # 1) at least one closing keyword with an issue number
          issues="$(printf '%s\n' "$body" \
            | grep -ioE '\b(closes|fixes|resolves)\b[^[:alnum:]]*#[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -u)" || true
          [ -n "$issues" ] || \
            fail "no issue linkage: the body must contain 'Closes #N' referencing an issue of this repository."

          # 2) every linked issue exists HERE and carries status:approved
          for n in $issues; do
            gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json number,labels >/dev/null 2>&1 \
              || fail "Closes #$n: issue #$n does not exist in $GITHUB_REPOSITORY."
            gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json labels \
              -q '.labels[].name' | grep -qx 'status:approved' \
              || fail "issue #$n is linked but lacks the owner-granted 'status:approved' label."
          done

          # 3) exactly one type:* label
          types="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name | select(startswith("type:"))] | join("\n")')"
          count="$(printf '%s' "$types" | grep -c '^type:' || true)"
          [ "$count" -eq 1 ] || \
            fail "PR must carry EXACTLY ONE 'type:*' label (found $count: $(printf '%s' "$types" | tr '\n' ' '))"

          echo "pr-gate: OK — linked issues: $(printf '%s' "$issues" | tr '\n' ' '); labels ok."
