<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="pi-streambeats — your music, inside the editor; local library and the StreamBeats catalog">
  <!-- pi-streambeats README banner (Gentle Hub card icon) — design artboard
       design/pi-streambeats-banner/02-wordmark-spectrum.html, palette taken from
       design/sb-music-card (canvas #0e1116, accent #7cc7e8, live #8bd98a).
       Static shapes and text only: no animation, no external references, system
       font stack, no emoji codepoints. -->
  <title>pi-streambeats — your music, inside the editor</title>

  <defs>
    <radialGradient id="glow" cx="640" cy="168" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc7e8" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7cc7e8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .wordmark,.tagline,.meta{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .wordmark{font-size:96px;font-weight:600;letter-spacing:-4.3px}
      .tagline{font-size:18px;letter-spacing:0.18px}
      .meta{font-size:14px}
    </style>
  </defs>

  <rect width="1280" height="400" fill="#0e1116"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <text class="wordmark" x="640" y="140" text-anchor="middle" fill="#d6dde5"><tspan fill="#7cc7e8">pi</tspan>-streambeats</text>

  <!-- spectrum: the progress bar quoted as bars; heights and colours from the artboard -->
  <g fill="#98a4b1">
    <rect x="515" y="224" width="9" height="14" rx="1"/>
    <rect x="530" y="216" width="9" height="22" rx="1"/>
    <rect x="560" y="212" width="9" height="26" rx="1"/>
    <rect x="590" y="208" width="9" height="30" rx="1"/>
    <rect x="605" y="220" width="9" height="18" rx="1"/>
    <rect x="635" y="190" width="9" height="48" rx="1"/>
    <rect x="650" y="210" width="9" height="28" rx="1"/>
    <rect x="665" y="222" width="9" height="16" rx="1"/>
    <rect x="695" y="214" width="9" height="24" rx="1"/>
    <rect x="710" y="226" width="9" height="12" rx="1"/>
    <rect x="740" y="218" width="9" height="20" rx="1"/>
    <rect x="755" y="228" width="9" height="10" rx="1"/>
  </g>
  <g fill="#7cc7e8">
    <rect x="545" y="204" width="9" height="34" rx="1"/>
    <rect x="620" y="200" width="9" height="38" rx="1"/>
    <rect x="725" y="208" width="9" height="30" rx="1"/>
  </g>
  <g fill="#8bd98a">
    <rect x="575" y="194" width="9" height="44" rx="1"/>
    <rect x="680" y="202" width="9" height="36" rx="1"/>
  </g>

  <text class="tagline" x="640" y="279" text-anchor="middle" fill="#98a4b1">your music, inside the editor</text>
  <text class="meta" x="640" y="326" text-anchor="middle" fill="#7d8a97">local library · StreamBeats · mpv · Pi + Gentle Shell</text>

  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#2a3540"/>
</svg>
